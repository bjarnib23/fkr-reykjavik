fkr_content.admin_add_page:
  path: '/admin/fkr/pages/add'
  defaults:
    _controller: '\Drupal\fkr_content\Controller\ContentController::addPage'
    _title: 'Bæta við síðu'
  requirements:
    _permission: 'access administration pages'

fkr_content.admin_pages:
  path: '/admin/fkr/pages'
  defaults:
    _controller: '\Drupal\fkr_content\Controller\ContentController::adminList'
    _title: 'Síður'
  requirements:
    _permission: 'access administration pages'

fkr_content.pages:
  path: '/api/fkr/pages'
  defaults:
    _controller: '\Drupal\fkr_content\Controller\ContentController::pages'
  methods: [GET]
  requirements:
    _access: 'TRUE'

